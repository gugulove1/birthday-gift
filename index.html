<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生日快乐</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 照片滑动区 -->
  <div class="stage">
    <div class="track" id="track"></div>
  </div>

  <!-- 顶部标题 -->
  <header class="header">
    <h1 id="title">生日快乐</h1>
    <p id="subtitle"></p>
  </header>

  <!-- 状态提示 -->
  <div class="status" id="status">⏳ 等待开始…</div>

  <!-- 摄像头预览 + 手势骨架 -->
  <div class="camera hidden" id="cameraWrap">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <!-- 左右箭头 -->
  <button class="arrow left" id="btnPrev" aria-label="上一张">‹</button>
  <button class="arrow right" id="btnNext" aria-label="下一张">›</button>

  <!-- 页码圆点 -->
  <div class="dots" id="dots"></div>

  <!-- 开始引导 -->
  <div class="intro" id="intro">
    <div class="intro-card">
      <div class="intro-title">🎂 生日快乐</div>
      <p>
        这是送给你的专属相册。<br />
        点击「开始」并允许使用摄像头，<br />
        然后 <b>举起手左右挥动</b> 就能翻看照片啦。
      </p>
      <p class="muted">也可以点击左右箭头 / 方向键 / 手指滑动</p>
      <button id="startBtn">开始</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
